<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Digital Consulting Studios">
  <title>Digital Consulting Studios</title>
  <defs>
    <linearGradient id="dcsG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6ee7ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="dcsG2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <filter id="dcsGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded dark tile -->
  <rect x="8" y="8" width="304" height="304" rx="68" fill="#0b0f18"/>
  <rect x="8" y="8" width="304" height="304" rx="68" fill="none"
        stroke="url(#dcsG)" stroke-width="3" opacity=".9"/>

  <!-- agent node network: a studio of agents, not people -->
  <g filter="url(#dcsGlow)">
    <!-- connections -->
    <g stroke="url(#dcsG)" stroke-width="3.2" opacity=".55" stroke-linecap="round">
      <line x1="160" y1="160" x2="160" y2="84"/>
      <line x1="160" y1="160" x2="226" y2="122"/>
      <line x1="160" y1="160" x2="226" y2="198"/>
      <line x1="160" y1="160" x2="160" y2="236"/>
      <line x1="160" y1="160" x2="94"  y2="198"/>
      <line x1="160" y1="160" x2="94"  y2="122"/>
    </g>
    <!-- outer agent nodes -->
    <g fill="url(#dcsG)">
      <circle cx="160" cy="84"  r="15"/>
      <circle cx="226" cy="122" r="15"/>
      <circle cx="226" cy="198" r="15"/>
      <circle cx="160" cy="236" r="15"/>
      <circle cx="94"  cy="198" r="15"/>
      <circle cx="94"  cy="122" r="15"/>
    </g>
    <!-- core -->
    <circle cx="160" cy="160" r="30" fill="#0b0f18" stroke="url(#dcsG2)" stroke-width="5"/>
    <circle cx="160" cy="160" r="12" fill="url(#dcsG2)"/>
  </g>
</svg>
